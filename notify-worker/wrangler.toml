# A single-purpose Worker that exists for one reason: Cloudflare Pages Functions
# cannot hold a [[send_email]] binding, but Workers can. The Pages Function calls
# this to deliver enquiry notifications through Cloudflare Email Routing.
#
# No third-party email vendor, no signup, no extra API key.

name = "rde-notify"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# Sends via Email Routing to a verified destination on the zone.
[[send_email]]
name = "NOTIFY"
destination_address = "dragonelectrix@gmail.com"

# NOTIFY_SECRET is a shared secret, set separately, so this is not an open relay:
#   wrangler secret put NOTIFY_SECRET

# Watchdog. Posts a REAL enquiry end to end every 6 hours, confirms the row lands,
# confirms notify_status flips, then deletes it. A health endpoint returning 200
# while the form is broken is exactly what already existed in April 2024.
[triggers]
crons = ["0 */6 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "rde-enquiries"
database_id = "e2b496de-b1cf-48cf-80d6-a2e68b77a47f"
